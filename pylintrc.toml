[tool.pylint.main]
py-version = "3.10"
ignore-patterns = [
    "^test_.*?\\.py$",
    "^conftest\\.py$"
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.logging]
logging-format-style = "new"

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "trailing-whitespace"
]

[tool.pylint.reports]
output-format = "parseable"
